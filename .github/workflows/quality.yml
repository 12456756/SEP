name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Deployment script regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release quality guard and Prisma packaging
        run: node --test scripts/check-release-quality.test.cjs deploy/standalone/prisma-client-artifact.test.cjs
      - name: Check transfer and rollback safety
        run: |
          python3 -m unittest discover -s deploy/standalone -p 'test_blue_green.py' -v
          bash -n scripts/deploy-standalone.sh deploy/standalone/sep-deploy.sh deploy/production/sep-deploy.sh
          bash scripts/test-deploy-transfer.sh
          bash deploy/standalone/test-sep-deploy.sh
          bash deploy/production/test-sep-deploy.sh
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm db:generate

      - name: Install video inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name: Backend typecheck
        working-directory: backend
        run: pnpm typecheck

      - name: Backend lint
        working-directory: backend
        run: pnpm exec eslint "src/**/*.ts"

      - name: Backend DI smoke test
        working-directory: backend
        # AppModule 依赖图单独运行，避免与大量单测共享 Nest 运行时状态。
        run: pnpm test -- --runInBand --runTestsByPath src/app.module.di.spec.ts

      - name: Backend unit tests
        working-directory: backend
        # DI 图探针单独执行；全量单测不重复装配 AppModule，避免 GitHub Actions
        # 中测试顺序导致 Nest DI 递归栈溢出。
        run: pnpm test -- --runInBand --testPathIgnorePatterns='app\.module\.di\.spec\.ts'

      - name: Web typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Web unit tests
        working-directory: web
        run: pnpm test

      - name: Production build
        run: pnpm build
