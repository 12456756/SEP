name: sep-migration

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: longdao-postgres-pgvector:18.4-v0.8.1-9a8afca54e78
    container_name: sep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sep_admin
      POSTGRES_PASSWORD: ${SEP_POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data
      SEP_DB_PASSWORD: ${SEP_DB_PASSWORD:?required}
    volumes:
      - /www/sep/postgres:/var/lib/postgresql/data
    networks:
      sep:
        aliases: [longdao-postgres]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sep_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:8-alpine
    container_name: sep-redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - /www/sep/redis:/data
    networks:
      sep:
        aliases: [longdao-redis]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    image: ${SEP_BACKEND_IMAGE:-sep-green-backend:42fc2644a38b}
    container_name: sep-green-backend
    restart: unless-stopped
    env_file:
      - path: ./backend.env
        format: raw
    environment:
      DATABASE_URL: ${SEP_DATABASE_URL:?required}
      REDIS_URL: redis://longdao-redis:6379/1
      API_BASE_URL: ${API_BASE_URL:-https://sep.longdaoec.com/api}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://sep.longdaoec.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://sep.longdaoec.com}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-https://sep.longdaoec.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sep.longdaoec.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://sep.longdaoec.com}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://ai.longdaoec.com/v1}
      SKILL_IMPORT_ENABLED: ${SKILL_IMPORT_ENABLED:-false}
      SKILL_IMPORT_INSTANCE_ID: ${SKILL_IMPORT_INSTANCE_ID:-}
      SKILL_IMPORT_MIN_CLIENT_VERSION: ${SKILL_IMPORT_MIN_CLIENT_VERSION:-1.0.0}
      SKILL_IMPORT_UPLOAD_CONCURRENCY: ${SKILL_IMPORT_UPLOAD_CONCURRENCY:-1}
    volumes:
      - /www/sep/uploads:/app/uploads
      - /www/sep/packages:/app/storage/packages
      - /www/sep/knowledge:/app/private/knowledge
      - /www/sep/tokenizers:/app/tokenizers:ro
    networks: [sep]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  web:
    image: ${SEP_WEB_IMAGE:-sep-green-web:42fc2644a38b-download-0.3.3}
    container_name: sep-green-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_ORIGIN: http://sep-green-backend:3001
      TZ: Asia/Shanghai
    networks: [sep]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrator:
    image: ${SEP_MIGRATOR_IMAGE:-sep-migrator:42fc2644a38b}
    profiles: [tools]
    restart: "no"
    env_file:
      - path: ./backend.env
        format: raw
    environment:
      DATABASE_URL: ${SEP_DATABASE_URL:?required}
    networks: [sep]

  downloads:
    image: caddy:2-alpine
    container_name: sep-downloads
    restart: unless-stopped
    volumes:
      - ./Downloads.Caddyfile:/etc/caddy/Caddyfile:ro
      - /www/sep/downloads:/srv:ro
    networks: [sep]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: sep-caddy
    profiles: [edge]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /www/sep/caddy/tls:/etc/caddy/tls:ro
      - /www/sep/caddy/data:/data
      - /www/sep/caddy/config:/config
      - /www/sep/caddy/logs:/var/log/caddy
    networks: [sep]
    logging: *logging

networks:
  sep:
    name: sep-migration-net
