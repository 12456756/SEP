name: sep-embedding

services:
  ollama:
    image: ${OLLAMA_IMAGE:?Immutable Ollama image is required}
    container_name: sep-ollama
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - /www/sep-embedding/data:/root/.ollama
    networks:
      stage: {}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  probe:
    image: ${PROBE_NODE_IMAGE:?Immutable probe image is required}
    profiles: [tools]
    entrypoint: [node]
    restart: "no"
    networks:
      stage: {}

networks:
  stage:
    name: sep-embedding-stage
  sep:
    name: sep-migration-net
    external: true
